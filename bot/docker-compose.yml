# Lulusia bot in production on the VPS.
# The .env (never committed) is created directly on the server.
name: lulusia-bot
services:
  bot:
    build: .
    image: lulusia-bot
    restart: unless-stopped
    env_file: .env
    # FRM listens on the host machine (port 8080, allowed by ufw for the Docker networks).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Custom alerts (data/alerts.json): kept from one rebuild to the next.
    volumes:
      - bot-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-data:
